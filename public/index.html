  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  font-size:15px; line-height:1.5; letter-spacing:.005em;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
header.appbar{
  position:sticky; top:0; z-index:20; background:var(--grad-header); color:#fff;
  padding:9px 16px 9px; display:flex; align-items:center; justify-content:space-between;
  padding-top:calc(9px + env(safe-area-inset-top));
  box-shadow:0 4px 18px var(--hdr-shadow); backdrop-filter:saturate(1.2);
}
header.appbar h1{font-size:16px; margin:0; letter-spacing:.1em; font-weight:800; text-shadow:0 1px 3px var(--on-grad-tsh);}
header.appbar .sub{font-size:11px; opacity:.8; letter-spacing:.06em;}
.appbar-actions{display:flex; gap:8px; align-items:center;}
.bell{position:relative; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.15); border-radius:12px; color:#fff; padding:7px 10px; font-size:16px; cursor:pointer; transition:background .15s;}
.bell:active{background:rgba(255,255,255,.28);}
.bell .dot{position:absolute; top:-5px; right:-5px; background:#FF5A5A; color:#fff; border-radius:999px; font-size:10px; min-width:17px; height:17px; line-height:17px; text-align:center; font-weight:700; padding:0 3px; box-shadow:0 2px 6px rgba(224,49,49,.5);}
.gear{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.15); color:#fff; border-radius:12px; padding:7px 10px; font-size:15px; cursor:pointer; transition:background .15s;}
.gear:active{background:rgba(255,255,255,.28);}

main{max-width:860px; margin:0 auto; padding:11px 13px 28px;}

nav.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:rgba(255,255,255,.88); backdrop-filter:blur(14px) saturate(1.4);
  border-top:1px solid rgba(228,235,244,.9);
  box-shadow:0 -6px 24px rgba(24,40,80,.06);
  display:flex; padding-bottom:env(safe-area-inset-bottom);
}
nav.tabbar{overflow-x:auto;-webkit-overflow-scrolling:touch;}
nav.tabbar button{
  flex:1 0 13%; min-width:56px; border:none; background:none; padding:7px 1px 5px; cursor:pointer;
  font-size:10px; color:var(--sub); font-weight:600; display:flex; flex-direction:column; align-items:center; gap:2px;
  font-family:inherit; white-space:nowrap; position:relative; transition:color .15s;
}
nav.tabbar button .ico{width:34px; height:27px; display:flex; align-items:center; justify-content:center; font-size:18px; line-height:1; border-radius:12px; transition:transform .2s cubic-bezier(.34,1.56,.64,1), background .2s;}
nav.tabbar button.active{color:var(--indigo-ink); font-weight:800;}
nav.tabbar button.active .ico{background:var(--indigo-bg); transform:translateY(-1px) scale(1.08);}
nav.tabbar button.active::before{content:""; position:absolute; top:0; left:50%; transform:translateX(-50%); width:26px; height:3px; border-radius:0 0 4px 4px; background:var(--grad);}

h2.page{font-size:19px; font-weight:800; margin:4px 0 10px; letter-spacing:.02em; display:flex; align-items:center; justify-content:space-between; gap:8px; position:relative; padding-left:13px;}
h2.page::before{content:""; position:absolute; left:0; top:50%; transform:translateY(-50%); width:5px; height:20px; border-radius:3px; background:var(--grad);}
h2.page small{font-size:12px; color:var(--sub); font-weight:400; letter-spacing:0;}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 14px; margin-bottom:10px; position:relative; transition:box-shadow .18s ease, transform .18s ease;}
.card-del{position:absolute; top:10px; right:10px; border:none; background:var(--red-bg); color:var(--red); border-radius:9px; width:34px; height:30px; font-size:14px; cursor:pointer; z-index:2; transition:background .15s;}
.card-del:active{background:#F9D5D5;}
.card .rec-title{padding-right:40px;}
.card.tap{cursor:pointer;}
.card.tap:hover{box-shadow:var(--shadow-lg); transform:translateY(-1px);}
.card.tap:active{transform:translateY(0); box-shadow:var(--shadow);}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:12px; padding:9px 16px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; letter-spacing:.02em; transition:transform .12s ease, box-shadow .15s ease, filter .15s ease;}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--grad); color:#fff; box-shadow:var(--shadow-btn); text-shadow:0 1px 2px var(--on-grad-tsh);}
.btn.primary:hover{filter:brightness(1.05);}
.btn.primary:active{box-shadow:0 2px 6px rgba(76,110,245,.3);}
.btn.ghost{background:#fff; color:var(--indigo-ink); border:1.5px solid var(--indigo); box-shadow:0 1px 2px rgba(24,40,80,.04);}
.btn.subtle{background:var(--indigo-bg); color:var(--indigo-ink);}
.btn.danger{background:var(--red-bg); color:var(--red);}
.btn.small{padding:6px 11px; font-size:12px; border-radius:9px;}
.btn.block{width:100%;}
.btn-row{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}

.seg{display:flex; background:var(--seg-bg); border-radius:12px; padding:4px; margin-bottom:12px;}
.seg button{flex:1; border:none; background:none; padding:8px 4px; border-radius:9px; font-size:13px; color:var(--sub); cursor:pointer; font-family:inherit; font-weight:700; transition:color .15s;}
.seg button.on{background:#fff; color:var(--indigo-ink); box-shadow:0 2px 8px rgba(24,40,80,.12);}

/* 月・年セレクタ */
.month-nav{display:flex; align-items:center; gap:8px; margin:2px 0 12px;}
.month-nav .mn-ico{font-size:16px;}
.month-nav select{width:auto; flex:0 1 auto; font-weight:800; color:var(--indigo-ink); background:var(--indigo-bg); border:1.5px solid var(--indigo); border-radius:10px; padding:8px 34px 8px 12px; font-size:14px;}

/* カード右上のアクション（紹介者作成＋削除） */
.card-actions{position:absolute; top:9px; right:9px; display:flex; gap:6px; z-index:2;}
.card-act{border:none; border-radius:9px; width:34px; height:30px; font-size:14px; cursor:pointer; transition:filter .15s, background .15s;}
.card-act.del{background:var(--red-bg); color:var(--red);}
.card-act.del:active{background:#F9D5D5;}
.card-act.ref{background:var(--indigo-bg); color:var(--indigo-ink);}
.card-act.ref:active{filter:brightness(.94);}
.apo-card .rec-title{padding-right:82px;}

/* 紹介場所のワンタップ選択チップ */
.place-chip{border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:7px 14px; font-size:13px; font-weight:700; color:var(--sub); cursor:pointer; font-family:inherit; transition:all .15s;}
.place-chip.on{background:var(--indigo-bg); border-color:var(--indigo); color:var(--indigo-ink);}

/* 長期目標の期限（隠しdate入力＋ボタン操作で今日の自動入力を防ぐ） */
.due-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; position:relative;}
.due-val{font-weight:800; color:var(--indigo-ink); font-size:15px;}
.due-hidden{position:absolute; opacity:0; width:1px; height:1px; padding:0; border:none; pointer-events:none;}
.due-input{max-width:200px; font-weight:700;}
.due-sel{width:auto; flex:0 1 auto; padding:9px 30px 9px 12px; font-weight:700; font-size:15px;}

/* 長期目標の折りたたみ（一文タップで期限・目標を編集） */
.lg-head{display:flex; align-items:center; gap:10px; cursor:pointer; padding:2px 0; user-select:none;}
.lg-line{flex:1; font-size:15px; font-weight:800; color:var(--indigo-ink); line-height:1.5;}
.lg-arrow{flex:none; font-size:12px; font-weight:800; color:var(--indigo); white-space:nowrap;}

/* スケジュールABCワンタップボタン */
.abc-btns{flex:none; width:96px; display:flex; gap:3px;}
.abc-b{flex:1; border:1.5px solid var(--line); background:#fff; border-radius:8px; padding:6px 0; font-size:13px; font-weight:800; color:var(--sub); cursor:pointer; font-family:inherit; transition:all .12s;}
.abc-b.on{background:var(--indigo); border-color:var(--indigo); color:#fff;}

.month-head{
  display:flex; align-items:center; gap:8px; margin:14px 0 6px; cursor:pointer; user-select:none;
}
.month-head .tab{
  background:var(--grad); color:#fff; font-weight:800; font-size:13px;
  padding:5px 16px; border-radius:10px 10px 0 0; letter-spacing:.06em; text-shadow:0 1px 2px var(--on-grad-tsh);
}
.month-head .cnt{background:var(--indigo-bg); color:var(--indigo-ink); font-size:12px; font-weight:800; border-radius:999px; padding:2px 11px;}
.month-head .arrow{margin-left:auto; color:var(--sub); font-size:12px;}
.month-body{border-top:2px solid var(--indigo); padding-top:10px;}

.rec-title{font-size:17px; font-weight:800; letter-spacing:.02em; margin-bottom:2px;}
.rec-sub{font-size:12px; color:var(--sub);}
.rec-meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
.chip{font-size:11px; padding:2px 8px; border-radius:999px; background:var(--chip-bg); color:var(--chip-ink);}
.chip.blue{background:var(--indigo-bg); color:var(--indigo-deep);}
.chip.red{background:var(--red-bg); color:var(--red);}
.chip.green{background:var(--green-bg); color:var(--green);}
.chip.amber{background:var(--amber-bg); color:var(--amber);}

.alert-banner{background:var(--amber-bg); border:1px solid #EAD9AE; border-radius:var(--radius); padding:12px 14px; margin-bottom:12px;}
.alert-banner h3{margin:0 0 6px; font-size:13.5px; color:var(--amber);}
.alert-banner ul{margin:0; padding-left:18px; font-size:13px;}
.alert-banner li{margin-bottom:2px;}

/* forms */
.field{margin-bottom:10px;}
.field>label{display:block; font-size:12px; font-weight:700; color:var(--indigo-deep); letter-spacing:.05em; margin-bottom:4px;}
.field>label .auto{font-weight:400; color:var(--sub); font-size:11px;}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%; border:1.5px solid var(--line); border-radius:11px; background:var(--soft);
  padding:10px 12px; font-size:15px; font-family:inherit; color:var(--ink);
  transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--indigo); background:#fff; box-shadow:0 0 0 3px var(--focus-ring);}
textarea{resize:vertical; min-height:64px; line-height:1.7;}
textarea.red, input.red{color:var(--red); font-weight:600;}
.inline{display:flex; gap:8px; align-items:flex-start;}
.inline>*{flex:1;}
.voice-wrap{display:flex; gap:6px; align-items:flex-start;}
.voice-wrap>:first-child{flex:1;}
.mic{flex:none; width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:#fff; font-size:17px; cursor:pointer; color:var(--indigo-deep);}
.mic.rec{background:var(--red); color:#fff; border-color:var(--red); animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.65;}}
.opt-edit{flex:none; border:none; background:none; color:var(--indigo); font-size:11px; cursor:pointer; text-decoration:underline; padding:2px 4px; font-family:inherit;}

.form-title{font-size:19px; font-weight:800; margin:2px 0 14px; line-height:1.4;}
.section-label{font-size:13px; font-weight:800; color:#fff; background:var(--grad); display:inline-block; padding:4px 14px; border-radius:9px; margin:12px 0 8px; letter-spacing:.08em; text-shadow:0 1px 2px var(--on-grad-tsh); box-shadow:0 3px 10px var(--accent-glow);}
.section-label.red{background:linear-gradient(135deg,#F03E3E,#C92A2A); box-shadow:0 3px 10px rgba(224,49,49,.25);}

/* schedule sheet */
.slot-row{display:flex; align-items:center; gap:8px; border-bottom:1px dashed var(--line); padding:3px 0;}
.slot-row .t{flex:none; width:56px; font-size:13px; font-weight:700; color:var(--indigo-deep); font-variant-numeric:tabular-nums;}
.slot-row input{border:none; background:none; border-radius:0; padding:6px 4px; font-size:14px;}
.slot-row input:focus{outline:none; background:var(--indigo-bg);}
.todo-item{display:flex; align-items:flex-start; gap:8px; padding:4px 0; font-size:14px;}
.todo-item input[type=checkbox]{width:20px; height:20px; margin-top:2px; accent-color:var(--indigo);}
.todo-item.done span{color:var(--sub); text-decoration:line-through;}
.scale-row{display:flex; gap:4px; flex-wrap:wrap; margin:4px 0 10px;}
.scale-row button{width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:13px; cursor:pointer; font-family:inherit;}
.scale-row button.on{background:var(--indigo); color:#fff; border-color:var(--indigo); font-weight:700;}
.sheet-note{font-size:11.5px; color:var(--sub); line-height:1.6; margin:4px 0;}

/* management table */
.tbl-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:var(--radius); background:#fff;}
table.mng{border-collapse:collapse; width:100%; min-width:900px; font-size:12.5px;}
table.mng th{background:var(--indigo-deep); color:#fff; padding:7px 8px; text-align:left; white-space:nowrap; font-size:11.5px; letter-spacing:.03em; position:sticky; top:0;}
table.mng td{border-bottom:1px solid var(--line); padding:5px 8px; white-space:nowrap; vertical-align:middle;}
table.mng tr:nth-child(even) td{background:var(--soft2);}
table.mng select{padding:4px 6px; font-size:12.5px; width:auto; min-width:60px;}
.abcd-A{color:var(--green); font-weight:800;} .abcd-B{color:var(--indigo); font-weight:800;}
.abcd-C{color:var(--sub); font-weight:800;} .abcd-D{color:var(--amber); font-weight:800;}

/* goals table */
table.goal{border-collapse:collapse; width:100%; font-size:13px;}
table.goal th, table.goal td{border:1px solid var(--line); padding:6px;}
table.goal th{background:var(--indigo-bg); color:var(--indigo-deep); font-size:11.5px;}
table.goal td:first-child{font-size:12px; background:var(--soft);}
table.goal input{border:none; text-align:center; padding:6px 2px; background:none;}
table.goal input:focus{background:var(--indigo-bg); outline:none;}

/* modal */
.modal-bg{position:fixed; inset:0; background:rgba(20,25,35,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
@media(min-width:640px){.modal-bg{align-items:center;}}
.modal{background:#fff; border-radius:16px 16px 0 0; width:100%; max-width:560px; max-height:85vh; overflow-y:auto; padding:18px 16px 26px;}
@media(min-width:640px){.modal{border-radius:16px;}}
.modal h3{margin:0 0 12px; font-size:16px;}
.opt-row{display:flex; align-items:center; gap:6px; padding:7px 0; border-bottom:1px dashed var(--line); transition:transform .12s ease;}
.opt-row span{flex:1; font-size:14px;}
.opt-row input{flex:1; padding:7px 8px; font-size:14px;}
.opt-row button.del{border:none; background:var(--red-bg); color:var(--red); border-radius:7px; padding:6px 10px; font-size:12px; cursor:pointer; flex:none;}
.drag-handle{cursor:grab; touch-action:none; padding:6px 6px; font-size:19px; color:var(--sub); flex:none; user-select:none; line-height:1;}
.drag-handle:active{cursor:grabbing;}
.opt-row.dragging{transition:none; background:var(--indigo-bg); border-radius:8px; box-shadow:0 4px 14px rgba(30,60,110,.18);}

.empty{color:var(--sub); font-size:13.5px; text-align:center; padding:26px 10px;}
.hint{font-size:11.5px; color:var(--sub); line-height:1.6;}
.toast{position:fixed; bottom:calc(76px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:9px 18px; border-radius:999px; font-size:13px; z-index:60; box-shadow:0 4px 14px rgba(0,0,0,.25); opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;}
.toast.show{opacity:1;}
.back{position:sticky; top:calc(46px + env(safe-area-inset-top)); z-index:19; display:inline-flex; align-items:center; background:#fff; border:1px solid var(--line); box-shadow:var(--shadow); color:var(--indigo-ink); font-size:13px; font-weight:800; cursor:pointer; padding:8px 15px; margin-bottom:12px; border-radius:999px; font-family:inherit;}
.back:active{transform:translateY(1px);}
.summary-box{background:var(--soft); border:1px dashed var(--line); border-radius:10px; padding:10px 12px; font-size:13px; white-space:pre-wrap; line-height:1.7;}
.big-title-preview{font-size:20px; font-weight:800; line-height:1.4; margin-bottom:12px; padding:10px 12px; background:var(--indigo-bg); border-radius:10px; color:var(--indigo-deep);}
.time-sel{display:flex;align-items:center;gap:4px;}
.time-sel select{width:auto;flex:1;text-align:center;}
.slot-row input.slot-red{color:var(--red);font-weight:600;border-left:1px dashed var(--line);}
.slot-row input{touch-action:manipulation;}
.slot-row input.strike{text-decoration:line-through; text-decoration-thickness:2px; text-decoration-color:var(--red); color:var(--sub);}
.msel-wrap{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px;}
.msel{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;background:#fff;cursor:pointer;}
.msel input{width:16px;height:16px;accent-color:var(--indigo);margin:0;}
.msel:has(input:checked){background:var(--indigo-bg);border-color:var(--indigo);color:var(--indigo-deep);font-weight:700;}
.abc-sel{flex:none;width:54px;color:var(--red);font-weight:800;text-align:center;padding:5px 4px;border-radius:8px;}
.mnum{flex:none;width:64px;text-align:center;border:1px solid var(--line);border-radius:8px;margin-left:6px;}
.mnum-head{flex:none;width:64px;text-align:center;font-size:11px;font-weight:700;color:var(--indigo-deep);margin-left:6px;}
/* --- イベント アイコン選択 --- */
.ev-cell-btn{border:1px solid var(--line); background:#fff; border-radius:10px; padding:4px 8px; cursor:pointer; min-width:46px; min-height:34px; display:inline-flex; align-items:center; gap:4px; font-family:inherit; transition:border-color .15s, box-shadow .15s;}
.ev-cell-btn:hover{border-color:var(--indigo); box-shadow:0 2px 8px var(--accent-glow);}
.ev-icons{display:inline-flex; flex-wrap:nowrap; gap:5px; align-items:center;}
.ev-ic{font-size:18px; line-height:1;}
.ev-tag{font-size:10.5px; background:var(--indigo-bg); color:var(--indigo-ink); border-radius:6px; padding:1px 6px; font-weight:800;}
.ev-none{color:var(--sub); font-size:13px;}
.ev-pick{display:flex; flex-wrap:wrap; gap:10px; margin:6px 0 2px;}
.ev-opt{display:flex; flex-direction:column; align-items:center; gap:4px; width:80px; padding:11px 4px 9px; border:1.5px solid var(--line); border-radius:14px; cursor:pointer; background:#fff; transition:transform .12s ease, border-color .15s, background .15s, box-shadow .15s; position:relative; user-select:none;}
.ev-opt:active{transform:scale(.96);}
.ev-opt input{position:absolute; opacity:0; pointer-events:none; margin:0;}
.ev-opt-ic{font-size:28px; line-height:1;}
.ev-opt-lb{font-size:11px; font-weight:800; color:var(--sub); text-align:center; line-height:1.3;}
.ev-opt.on{border-color:var(--indigo); background:var(--indigo-bg); box-shadow:0 4px 12px var(--accent-glow);}
.ev-opt.on .ev-opt-lb{color:var(--indigo-ink);}
.ev-opt.on::after{content:"✓"; position:absolute; top:-7px; right:-7px; width:20px; height:20px; border-radius:50%; background:var(--grad); color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px var(--accent-glow);}
/* --- A4プレビュー --- */
#a4wrap{width:100%;overflow:hidden;}
.a4{width:794px;min-height:1123px;background:#fff;border:1px solid #ccc;box-shadow:0 3px 14px rgba(0,0,0,.15);padding:36px;transform-origin:top left;color:#1b1b1b;font-size:12.5px;line-height:1.55;display:flex;flex-direction:column;}
.a4 .a4head{font-size:15px;font-weight:800;margin-bottom:6px;}
.a4 .gline{border-bottom:1px solid #777;padding:0 3px;}
.a4 .a4goal{font-size:12.5px;margin:3px 0;font-weight:700;line-height:1.5;}
.a4 .a4goal .gline{font-size:12.5px;min-width:220px;}
.a4, .a4 *{-webkit-text-size-adjust:100%!important; text-size-adjust:100%!important;}
.a4 .cols{display:flex;gap:16px;margin-top:10px;flex:1;align-items:stretch;}
.a4 .colL{width:45%;display:flex;flex-direction:column;}.a4 .colR{flex:1;display:flex;flex-direction:column;}
.a4 .slotlist{display:flex;flex-direction:column;flex:1;}
.a4 .slotlist .srow{flex:1;}
.a4 .grow{flex:1;display:flex;flex-direction:column;}
.a4 .grow .redtxt{flex:1;}
.a4 h5{background:#2C6FBE;color:#fff;display:inline-block;padding:1px 10px;border-radius:4px;margin:9px 0 4px;font-size:12px;letter-spacing:.06em;font-weight:700;}
.a4 .srow{display:flex;border-bottom:1px dotted #999;align-items:flex-end;min-height:17px;}
.a4 .srow .st{width:48px;font-weight:700;color:#2C6FBE;font-size:11px;}
.a4 .srow .sv{flex:1;padding:0 3px;font-size:12px;}
.a4 .srow .sv.sred{color:#C0392B;font-weight:600;border-left:1px dotted #bbb;}

<script>
/* ============================================================
   My Life手帳 — オフライン対応・複数端末同期版
   ============================================================ */
/* ---------- サービスワーカー登録（オフライン起動用＋新版の自動更新） ---------- */
if('serviceWorker' in navigator){
  let _swRefreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(_swRefreshing)return; _swRefreshing=true; window.location.reload(); /* 新しい版が有効になったら自動で読み込み直す */
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{ try{reg.update();}catch(e){} }).catch(()=>{});
  });
}
/* ---------- Supabase 接続設定 ---------- */
const SUPABASE_URL='https://zgeakzkwqwcmiuvgjmwy.supabase.co';
const SUPABASE_KEY='sb_publishable_bYT80ObOGgiAViVQuVXISA_TlhWrxsU';
let sb=null, sdkLoadFailed=false;
try{
  if(!window.supabase||!window.supabase.createClient){throw new Error('SDK未読み込み');}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
}catch(e){
  sdkLoadFailed=true;
  console.error('Supabase SDK load failed',e);
}
let currentUser=null;
const _apoSyncTimers={}, _refSyncTimers={};

/* ---------- ローカルキャッシュ（オフラインで即表示・即記入できる層） ---------- */
function localKey(){return 'mylifetecho-cache-'+(currentUser?currentUser.id:'guest');}
function queueKey(){return 'mylifetecho-queue-'+(currentUser?currentUser.id:'guest');}
const localCache={
  get(){try{const v=localStorage.getItem(localKey());return v?JSON.parse(v):null;}catch(e){return null;}},
  set(data){try{localStorage.setItem(localKey(),JSON.stringify(data));}catch(e){console.error('local save failed',e);}}
};

/* ---------- 同期待ちキュー（オフライン中の変更を貯めておく） ---------- */
function loadQueue(){try{const v=localStorage.getItem(queueKey());return v?JSON.parse(v):[];}catch(e){return [];}}
function saveQueueArr(q){try{localStorage.setItem(queueKey(),JSON.stringify(q));}catch(e){}}
function queueOp(op){
  const q=loadQueue();
  /* 同じレコードへの未送信の変更は1つにまとめる（無駄な送信を減らす） */
  const idx=q.findIndex(x=>x.type===op.type&&x.rowId===op.rowId);
  if(idx>=0)q[idx]=op; else q.push(op);
  saveQueueArr(q);
  setSyncStatus('wait','未同期の変更あり');
}
async function flushQueue(){
  if(!currentUser||!navigator.onLine)return;
  let q=loadQueue();
  if(!q.length){setSyncStatus('ok','同期済み');return;}
  setSyncStatus('wait','同期中…');
  const remaining=[];
  for(const op of q){
    try{
      if(op.op==='delete'){
        const {error}=await sb.from(op.type).delete().eq('id',op.rowId).eq('user_id',currentUser.id);
        if(error)remaining.push(op);
      }else if(op.type==='app_data'){
        const {error}=await sb.from('app_data').upsert({user_id:currentUser.id,data:op.payload},{onConflict:'user_id'});
        if(error)remaining.push(op);
      }else{
        const {error}=await sb.from(op.type).upsert({id:op.rowId,user_id:currentUser.id,data:op.payload},{onConflict:'id'});
        if(error)remaining.push(op);
      }
    }catch(e){remaining.push(op);}
  }
  saveQueueArr(remaining);
  setSyncStatus(remaining.length?'wait':'ok', remaining.length?'一部未同期':'同期済み');
}
window.addEventListener('online',flushQueue);
setInterval(()=>{if(navigator.onLine)flushQueue();},20000);

function setSyncStatus(kind,label){
  const dot=document.getElementById('syncDot'), lab=document.getElementById('syncLabel');
  if(dot){dot.className='sync-dot '+kind;}
  if(lab){lab.textContent=label;}
}

/* ---------- app_data（選択肢・スケジュール・目標などのひとまとめデータ） ---------- */
function blobFromState(){
  const copy=Object.assign({},state);
  delete copy.apos; delete copy.referrals; /* この2つは別テーブルで個別に同期する */
  return copy;
}
let appDataSaveTimer=null;
function queueAppDataSave(){
  clearTimeout(appDataSaveTimer);
  appDataSaveTimer=setTimeout(pushAppData,500);
}
async function pushAppData(){
  const payload=blobFromState();
  if(!currentUser)return;
  if(!navigator.onLine){queueOp({type:'app_data',op:'upsert',rowId:'blob',payload});return;}
  setSyncStatus('wait','同期中…');
  try{
    const {error}=await sb.from('app_data').upsert({user_id:currentUser.id,data:payload},{onConflict:'user_id'});
    if(error){queueOp({type:'app_data',op:'upsert',rowId:'blob',payload});}
    else{setSyncStatus('ok','同期済み');}
  }catch(e){queueOp({type:'app_data',op:'upsert',rowId:'blob',payload});}
}
async function pullAppData(){
  if(!currentUser)return false;
  try{
    const {data,error}=await sb.from('app_data').select('data').eq('user_id',currentUser.id).maybeSingle();
    if(!error&&data&&data.data){Object.assign(state,data.data);return true;}
  }catch(e){/* オフライン時などは無視してローカルの内容を使う */}
  return false;
}

/* ---------- アポ記録・紹介者情報（1件ずつ個別に同期＝共有機能のため） ---------- */
async function syncApoRow(id){
  const a=state.apos.find(x=>x.id===id); if(!a||!currentUser)return;
  const payload={}; Object.keys(a).forEach(k=>{if(!k.startsWith('_'))payload[k]=a[k];});
  if(!navigator.onLine){queueOp({type:'apos',op:'upsert',rowId:id,payload});return;}
  try{
    const {error}=await sb.from('apos').upsert({id,user_id:currentUser.id,data:payload},{onConflict:'id'});
    if(error)queueOp({type:'apos',op:'upsert',rowId:id,payload});
  }catch(e){queueOp({type:'apos',op:'upsert',rowId:id,payload});}
}
async function deleteApoRow(id){
  if(!currentUser)return;
  if(!navigator.onLine){queueOp({type:'apos',op:'delete',rowId:id});return;}
  try{
    const {error}=await sb.from('apos').delete().eq('id',id).eq('user_id',currentUser.id);
    if(error)queueOp({type:'apos',op:'delete',rowId:id});
  }catch(e){queueOp({type:'apos',op:'delete',rowId:id});}
}
async function syncReferralRow(id){
  const r=state.referrals.find(x=>x.id===id); if(!r||!currentUser)return;
  const payload={}; Object.keys(r).forEach(k=>{if(!k.startsWith('_'))payload[k]=r[k];});
  if(!navigator.onLine){queueOp({type:'referrals',op:'upsert',rowId:id,payload});return;}
  try{
    const {error}=await sb.from('referrals').upsert({id,user_id:currentUser.id,data:payload},{onConflict:'id'});
    if(error)queueOp({type:'referrals',op:'upsert',rowId:id,payload});
  }catch(e){queueOp({type:'referrals',op:'upsert',rowId:id,payload});}
}
async function deleteReferralRow(id){
  if(!currentUser)return;
  if(!navigator.onLine){queueOp({type:'referrals',op:'delete',rowId:id});return;}
  try{
    const {error}=await sb.from('referrals').delete().eq('id',id).eq('user_id',currentUser.id);
    if(error)queueOp({type:'referrals',op:'delete',rowId:id});
  }catch(e){queueOp({type:'referrals',op:'delete',rowId:id});}
}
async function pullApposAndReferrals(){
  if(!currentUser)return;
  try{
    const {data:apoRows,error:e1}=await sb.from('apos').select('id,data').eq('user_id',currentUser.id);
    /* クラウドに行がある時だけ上書き。空配列でローカルを消さない（未同期のデータを守るため） */
    if(!e1&&apoRows&&apoRows.length)state.apos=apoRows.map(r=>Object.assign({},r.data,{id:r.id}));
  }catch(e){}
  try{
    const {data:refRows,error:e2}=await sb.from('referrals').select('id,data').eq('user_id',currentUser.id);
    if(!e2&&refRows&&refRows.length)state.referrals=refRows.map(r=>Object.assign({},r.data,{id:r.id}));
  }catch(e){}
}
/* 初回など、クラウドが空のときに手元のデータをアップして初期化する */
async function pushAllLocalToCloud(){
  if(!currentUser||!navigator.onLine)return;
  try{ await pushAppData(); }catch(e){}
  for(const a of (state.apos||[])){ if(a&&a.id){ try{ await syncApoRow(a.id); }catch(e){} } }
  for(const r of (state.referrals||[])){ if(r&&r.id){ try{ await syncReferralRow(r.id); }catch(e){} } }
}

/* ---------- 全体の保存（ローカルは常に即保存、サーバーへは非同期で反映） ---------- */
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ localCache.set(state); queueAppDataSave(); },200);
}


/* ---------- 初期データ ---------- */
function defaultState(){
  return {
    options:{
      income:['~300','200：400','300：500','400：600','500：700','600：800','800万〜'],
      job:['会SE','FSE','会事務','会営業'],

      self:['自分のキャリアの話','家族の話','バイトの話','結婚や子どもの話','金塚さんと出会った経緯'],
      origin:['イベント','友人の紹介','SNS','元同僚','アプリ'],

    },
    apos:[], referrals:[], schedules:{},
    scheduleTemplate:{
      longGoal:'2026年7月31日時点の目標『テックビズのコンサルタントになる』',
      timeSlots:['5:30','6:00','6:30','7:00','7:30','8:00','8:30','9:00','9:30','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','17:30','18:00','18:30','19:00','19:30','20:00','20:30','21:00','21:30','22:00','22:30','23:00','23:30'],
      todo1Title:'毎日ToDo', todo2Title:'毎日ToDo SNS作業',
      apoListTitle:'今日のアポした人リスト（箇条書き）', metricsTitle:'今日終了時点の今月の数字（目標）',
      customFields:[],
      todo1:['アポの現場 活動報告→10min','電話報連相→3min','昨日アポした人に御礼','明日と3日後に会う人に連絡','LINE全返信','お誘いのLINEを送る（アポ・代理店イベント・主催イベント）','帳簿更新＆領収書整理','次週アポ数確認（毎週木曜日）','1week振り返り（毎週木曜日）','土日アポ戦略立て（毎週金曜日）','帳簿管理、予算組見直し（20日前後）','作業報告書提出（月末）','今月振り返り次月目標（月末）'],

    },
    longGoals:[], monthlyGoals:[], weeklyReviews:[], mtgs:[],

  };
}
let state=defaultState();

/* ---------- ヘルパー ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function thisYear(){return new Date().getFullYear();}
function monthKey(dateStr){return dateStr?dateStr.slice(0,7):'不明';}
function monthLabel(mk){if(mk==='不明')return '日付未設定';const[y,m]=mk.split('-');return y+'年'+Number(m)+'月';}
function fmtDate(d){if(!d)return '';const[y,m,dd]=d.split('-');const w=['日','月','火','水','木','金','土'][new Date(d+'T00:00:00').getDay()];return y+'/'+Number(m)+'/'+Number(dd)+'（'+w+'）';}
function daysSince(dateStr){if(!dateStr)return 9999;return Math.floor((new Date(today())-new Date(dateStr))/86400000);}
const CIRC=['','①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
function circled(n){n=Number(n)||0;return n>=2?(CIRC[n]||('('+n+')')):'';}
function toKatakana(s){return String(s||'').replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));}
function hasKanaOnly(s){return /^[\u3041-\u3096\u30A1-\u30FA\u30FCー\s　]*$/.test(s||'');}
/* 年齢・経験年数：記録した年から1年ごとに+1 */
function grownNumber(base,baseYear){
  const b=parseFloat(base); if(isNaN(b))return base||'';
  const y=Number(baseYear)||thisYear();
  return b+Math.max(0,thisYear()-y);
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2200);}
function joinVal(sel,txt){const s=Array.isArray(sel)?sel.filter(Boolean).join('、'):(sel||'');return [s,txt].filter(Boolean).join(' ');}

/* ---------- 音声入力 ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let activeRec=null;
function toggleVoice(btn,targetId){
  if(!SR){toast('この端末では🎤は使えません。キーボードのマイク（音声入力）から入力できます');return;}
  if(activeRec){activeRec.stop();return;}
  const target=document.getElementById(targetId); if(!target)return;
  const rec=new SR(); rec.lang='ja-JP'; rec.interimResults=false; rec.continuous=true;
  activeRec=rec; btn.classList.add('rec'); btn.textContent='■';
  rec.onresult=e=>{
    let txt='';
    for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)txt+=e.results[i][0].transcript;}
    if(txt){
      target.value=(target.value?target.value+(target.tagName==='TEXTAREA'?'\n':''):'')+txt;
      target.dispatchEvent(new Event('input',{bubbles:true}));
    }
  };
  rec.onend=()=>{activeRec=null;btn.classList.remove('rec');btn.textContent='🎤';};
  rec.onerror=()=>{activeRec=null;btn.classList.remove('rec');btn.textContent='🎤';toast('音声入力を終了しました');};
  try{rec.start();toast('録音中… もう一度押すと停止');}catch(e){activeRec=null;}
}

/* ---------- テキストエリア自動リサイズ（全文が見える） ---------- */
function autoGrow(el){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px';}
function growAll(){document.querySelectorAll('textarea').forEach(t=>{t.style.overflow='hidden';autoGrow(t);});}
document.addEventListener('input',e=>{if(e.target&&e.target.tagName==='TEXTAREA')autoGrow(e.target);});
/* エンターで「同じ列の下の欄」へ移動（スケジュールの予定・変更／各数字表） */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing)return; /* 日本語変換中は無視 */
  const el=e.target;
  if(!el||el.tagName!=='INPUT')return;
  const slot=el.closest('.slot-row');
  const tbl=el.closest('table.goal');
  if(!slot&&!tbl)return;
  e.preventDefault();
  let next=null;
  if(slot){
    /* 予定は予定の列、変更は変更の列を、それぞれ下の行へ */
    const isRed=el.classList.contains('slot-red');
    const col=Array.from(document.querySelectorAll(isRed?'.slot-row input.slot-red':'.slot-row input:not(.slot-red)'));
    const i=col.indexOf(el); if(i>=0&&i<col.length-1)next=col[i+1];
  }else{
    const cell=el.closest('td'), row=el.closest('tr');
    if(cell&&row){
      const dataRows=Array.from(tbl.querySelectorAll('tr')).filter(r=>r.querySelector('input'));
      if(dataRows.length<=1){
        /* 横1行の表（週次の❶②⑤など）：右のマスへ */
        let c=cell.nextElementSibling;
        while(c&&!next){ const ni=c.querySelector('input:not([type=checkbox])'); if(ni)next=ni; c=c.nextElementSibling; }
      }else{
        /* 複数行の表：同じ列の下の行の入力欄へ */
        const ci=Array.from(row.children).indexOf(cell);
        let r=row.nextElementSibling;
        while(r&&!next){ const c=r.children[ci]; const ni=c&&c.querySelector('input:not([type=checkbox])'); if(ni)next=ni; r=r.nextElementSibling; }
      }
    }
  }
  if(next){next.focus();try{next.select();}catch(_){}}
  else el.blur();
});

/* ---------- 選択肢のドラッグ並べ替え（指の動きに1:1で追従する方式） ---------- */
let _optDrag=null;
function startOptDrag(e,key,label){
  e.preventDefault();
  const row=e.currentTarget.closest('.opt-row');
  const list=document.getElementById('optList');
  if(!row||!list)return;
  const rows=Array.from(list.querySelectorAll('.opt-row'));
  const idx=rows.indexOf(row);
  const rowH=row.offsetHeight;
  _optDrag={key,label,row,list,rows,startIndex:idx,curIndex:idx,startY:e.clientY,rowH};
  row.classList.add('dragging');
  row.style.position='relative';
  row.style.zIndex='5';
  try{row.setPointerCapture(e.pointerId);}catch(err){}
  row.addEventListener('pointermove',onOptDragMove);
  row.addEventListener('pointerup',endOptDrag);
  row.addEventListener('pointercancel',endOptDrag);
}
function onOptDragMove(e){
  const d=_optDrag; if(!d)return;
  const dy=e.clientY-d.startY;
  d.row.style.transform='translateY('+dy+'px)';
  let target=d.startIndex+Math.round(dy/d.rowH);
  if(target<0)target=0;
  if(target>d.rows.length-1)target=d.rows.length-1;
  if(target!==d.curIndex){
    d.rows.forEach((r,i)=>{
      if(r===d.row)return;
      let shift=0;
      if(d.curIndex<target){ if(i>d.curIndex&&i<=target)shift=-1; }
      else{ if(i>=target&&i<d.curIndex)shift=1; }
      r.style.transform=shift?'translateY('+(shift*d.rowH)+'px)':'';
    });
    d.curIndex=target;
  }
}
function endOptDrag(e){
  const d=_optDrag; if(!d)return;
  d.row.classList.remove('dragging');
  d.row.style.transform=''; d.row.style.position=''; d.row.style.zIndex='';
  d.row.removeEventListener('pointermove',onOptDragMove);
  d.row.removeEventListener('pointerup',endOptDrag);
  d.row.removeEventListener('pointercancel',endOptDrag);
  d.rows.forEach(r=>{if(r!==d.row)r.style.transform='';});
  if(d.curIndex!==d.startIndex){
    const arr=state.options[d.key];
    const item=arr.splice(d.startIndex,1)[0];
    arr.splice(d.curIndex,0,item);
    save();
  }
  _optDrag=null;
  editOptions(d.key,d.label);
  render();
}

/* ---------- 1か月経過アラート ---------- */
function computeAlerts(){
  const byName={};
  state.apos.forEach(a=>{
    if(!a.name)return;
    const k=a.name.trim(); if(!byName[k])byName[k]=[];
    byName[k].push(a);
  });
  const alerts=[];
  Object.keys(byName).forEach(name=>{
    const recs=byName[name].slice().sort((x,y)=>(x.apoDate||'').localeCompare(y.apoDate||''));
    const latest=recs[recs.length-1];
    const strat=joinVal(latest.strategySel,latest.strategy);
    if(strat.includes('終了'))return;
    const d=daysSince(latest.apoDate);
    if(latest.apoDate&&d>=30){alerts.push({name,days:d,last:latest.apoDate,id:latest.id});}
  });
  alerts.sort((a,b)=>b.days-a.days);
  return alerts;
}
function updateBell(){
  const n=computeAlerts().length;
  const dot=$('#bellDot');
  dot.style.display=n?'block':'none'; dot.textContent=n;
}
function showAlerts(){
  const alerts=computeAlerts();
  openModal('<h3>🔔 1か月以上アポが空いている方</h3>'+
    (alerts.length?alerts.map(a=>'<div class="opt-row" style="cursor:pointer" onclick="closeModal();openApoForm(\''+a.id+'\')"><span><b>'+esc(a.name)+'</b>さん<br><small style="color:var(--sub)">最終アポ：'+fmtDate(a.last)+'（'+a.days+'日経過）</small></span><span class="chip amber">'+a.days+'日</span></div>').join(''):
    '<div class="empty">現在、1か月以上空いている方はいません 🎉</div>')+
    '<p class="hint" style="margin-top:12px">※「次の戦略」で「終了」を選んだ方は対象外です。アプリを開いたときに自動でチェックされ、通知を許可するとスマホに通知が届きます。</p>'+
    '<div class="btn-row"><button class="btn subtle block" onclick="closeModal()">閉じる</button></div>');
}
function tryNotify(){
  const alerts=computeAlerts();
  if(!alerts.length||!('Notification'in window))return;
  if(Notification.permission==='granted'){
    const key='ses-notified-'+today();
    try{
      if(sessionStorage.getItem(key))return;
      sessionStorage.setItem(key,'1');
    }catch(e){}
    try{new Notification('My Life手帳',{body:alerts.length+'名の方が最終アポから1か月以上経過しています（'+alerts.slice(0,3).map(a=>a.name+'さん').join('、')+(alerts.length>3?' ほか':'')+'）'});}catch(e){}
  }
}
function askNotifyPermission(){
  if(!('Notification'in window)){toast('この環境は通知に対応していません');return;}
  Notification.requestPermission().then(p=>{toast(p==='granted'?'通知を許可しました':'通知は許可されませんでした');tryNotify();});
}

   ============================================================ */
function apoTitle(a){
  const age=grownNumber(a.age,a.ageYear);
  const income=joinVal(a.incomeSel,a.income);
  return circled(a.count)+(a.name||'（名前未入力）')+'、'+(age!==''?age+'歳':'年齢未入力')+'、'+(income||'年収未入力');
}
function newApo(base){
  const a={
    id:uid(), createdAt:Date.now(), updatedAt:Date.now(),
    apoDate:today(), name:'', nameKana:'', age:'', ageYear:thisYear(),
    incomeSel:'', income:'', jobSel:'', job:'', devSel:'', dev:'',
    exp:'', expYear:thisYear(), count: base?String((Number(base.count)||1)+1):'1',
    purposeSel:'', purpose:'', landing:'', strategySel:'', strategy:'',
    memo:'', selfSel:'', self:'', history:'',
    abcd:'', direct:'', eventSel:[], skillSheet:''
  };
  if(base){ /* 2回目以降：名前・年齢・年収・開発構築・経験年数を引き継ぎ */
    a.name=base.name; a.nameKana=base.nameKana;
    a.age=base.age; a.ageYear=base.ageYear;
    a.incomeSel=base.incomeSel; a.income=base.income;
    a.devSel=base.devSel; a.dev=base.dev;
    a.exp=base.exp; a.expYear=base.expYear;
    a.jobSel=base.jobSel; a.job=base.job;
    a.abcd=base.abcd; a.direct=base.direct; a.eventSel=base.eventSel; a.skillSheet=base.skillSheet;
    const hist='【過去のアポの内容】（'+(base.apoDate?fmtDate(base.apoDate):'日付不明')+'・'+(base.count||'1')+'回目）\n'+
      '・アポした目的：'+(joinVal(base.purposeSel,base.purpose)||'—')+'\n'+
      '・着地：'+((base.landing||'').trim()||'—')+'\n'+
      '・次の戦略：'+(joinVal(base.strategySel,base.strategy)||'—')+'\n'+
      '・アポのメモ：'+((base.memo||'').trim()||'—')+'\n'+
      '・自身の話：'+(joinVal(base.selfSel,base.self)||'—');
    a.history=hist+(base.history?'\n\n'+base.history:'');
  }
  state.apos.push(a); save(); syncApoRow(a.id);
  return a;
}

   紹介者情報
   ============================================================ */
function summarizeApo(a){
  if(!a)return '';
  const name=(a.name||'').trim();
  const recs=(name?state.apos.filter(x=>(x.name||'').trim()===name):[a])
    .slice().sort((x,y)=>(((x.apoDate||'')+'_'+x.createdAt)).localeCompare(((y.apoDate||'')+'_'+y.createdAt))); /* 古い→新しい */
  const lines=[];
  recs.forEach(r=>{
    const land=(r.landing||'').replace(/\s+/g,' ').trim();
    if(!land)return;
    const t=land.length>140?land.slice(0,140)+'…':land;
    lines.push('（'+(r.count||'?')+'回目）'+t);
  });
  if(!lines.length)return '（アポ記録の「着地」が未記入のため要約できません。着地を記入してから「再生成」を押してください）';
  if(lines.length===1){
    const only=(recs.find(r=>(r.landing||'').trim())||{}).landing.replace(/\s+/g,' ').trim();
    return only.length>160?only.slice(0,160)+'…':only;
  }
  return lines.join('\n');
}
function createRefFromApo(apoId){

  const ex=state.referrals.find(r=>{
    if(r.apoId===apoId)return true;
    const ra=state.apos.find(x=>x.id===r.apoId);
    return ra&&ra.name&&a.name&&ra.name.trim()===a.name.trim();
  });
  if(ex){
    subView={type:'refForm',id:ex.id}; currentTab='ref'; syncTabbar(); render(); window.scrollTo(0,0);
    toast('この方の紹介者情報は既にあります。追記・変更はそのまま上書き保存されます');
    return;

  const r={
    id:uid(), createdAt:Date.now(), apoId:apoId,
    refDate:today(), place:'', originSel:'', jobExtra:'',
    detail:summarizeApo(a), friendInfo:'', request:'', refLandingSel:'', refLanding:'',
    resultLanding:'', nextActionSel:'', nextAction:'', resultSummary:''
  };

function refShareText(id){
  const r=state.referrals.find(x=>x.id===id); if(!r)return '';
  const a=state.apos.find(x=>x.id===r.apoId)||{};
  const L=[];
  L.push('■ '+(a.name||'（名前未入力)')+'さん');
  L.push('【紹介情報】');
  L.push('・紹介日：'+(r.refDate?fmtDate(r.refDate):'未定'));
  if(r.place)L.push('・紹介場所：'+r.place);
  if(r.originSel)L.push('・知り合った経緯：'+r.originSel);
  if(a.age!=='')L.push('・年齢：'+grownNumber(a.age,a.ageYear)+'歳');
  if(joinVal(a.incomeSel,a.income))L.push('・年収：'+joinVal(a.incomeSel,a.income));
  if(joinVal(a.jobSel,a.job)||r.jobExtra)L.push('・仕事：'+[joinVal(a.jobSel,a.job),r.jobExtra].filter(Boolean).join(' / '));
  if(joinVal(a.devSel,a.dev))L.push('・開発・構築の有無：'+joinVal(a.devSel,a.dev));
  if(a.exp!=='')L.push('・経験年数：約'+grownNumber(a.exp,a.expYear)+'年');
  if(r.detail)L.push('・詳細：'+r.detail);
  if(r.friendInfo)L.push('・その他友人情報：'+r.friendInfo);
  if(r.request)L.push('・要望：'+r.request);
  if(joinVal(r.refLandingSel,r.refLanding))L.push('・紹介の着地：'+joinVal(r.refLandingSel,r.refLanding));
  if(r.resultLanding||r.nextAction||r.nextActionSel||r.resultSummary){
    L.push('【紹介結果】');
    if(r.resultLanding)L.push('・着地：'+r.resultLanding);
    if(joinVal(r.nextActionSel,r.nextAction))L.push('・次のアクション：'+joinVal(r.nextActionSel,r.nextAction));
    if(r.resultSummary)L.push('・話した内容の概要：'+r.resultSummary);
  }
  /* 各欄の文末改行などで空白行が入らないよう、連続する改行を1つにまとめる */
  return L.map(s=>String(s).replace(/\s+$/,'')).join('\n').replace(/\n{2,}/g,'\n').trim();
}

/* イベント名 → アイコン（部分一致で柔軟にマッチ。未登録の独自イベントは 🏷️） */
const EVENT_ICON_MAP=[
  ['オンライン飲み','💻'],['飲み会','🍺'],['ボドゲ','🃏'],['ボードゲーム','🃏'],
  ['お金の勉強','💰'],['勉強会','📚'],['セミナー','📚'],['ランチ','🍴'],['お茶','☕'],
  ['イベント','🎪'],['交流','🤝'],['スポーツ','⚽'],['旅行','✈️']
];
function eventIcon(name){
  if(!name)return '';
  for(const [key,ic] of EVENT_ICON_MAP){ if(name.includes(key)) return ic; }
  return '';
}
function eventCell(a){
  const cur=Array.isArray(a.eventSel)?a.eventSel:(a.eventSel?[a.eventSel]:[]);
  let inner;
  if(!cur.length){ inner='<span class="ev-none">—</span>'; }
  else{
    inner='<span class="ev-icons">'+cur.map(o=>{
      const ic=eventIcon(o);
      return ic?'<span class="ev-ic" title="'+esc(o)+'">'+ic+'</span>'
               :'<span class="ev-tag">'+esc(o)+'</span>';
    }).join('')+'</span>';
  }
  return '<button class="ev-cell-btn" onclick="openEventPicker(\''+a.id+'\')" aria-label="イベントを選ぶ">'+inner+'</button>';
}
function openEventPicker(apoId){
  const a=state.apos.find(x=>x.id===apoId); if(!a)return;

    '<div class="ev-pick">'+opts.map(o=>{

function manageView(){

function slashDate(d){if(!d)return '';const p=d.split('-');return p[0]+'/'+Number(p[1])+'/'+Number(p[2]);}
function lgText(g){return (g.due?slashDate(g.due)+'までに':'')+(g.text||'');}
function addLongGoal(){
  const gid=uid();
  state.longGoals.push({id:gid,reviewDate:today(),due:'',text:'',createdAt:Date.now()});
  state.ui['lgo_'+gid]=true; /* 新規追加時は開いて編集できるように */
  save();render();
}
function setLG(id,f,v){
  const g=state.longGoals.find(x=>x.id===id); if(!g)return;
  g[f]=v; save();

}
function delLG(id){askConfirm('この目標を削除しますか？',()=>{state.longGoals=state.longGoals.filter(x=>x.id!==id);save();render();});}
const MG_ROWS=[['r1','❶参画数 ※決めた人'],['r2','❷スキルシート回収数'],['r3','❸紹介数（直紹介）'],['r4','　紹介数（イベント）'],['r5','❹アポ数（初アポ）'],['r6','　アポ数（2回目以降）'],['r7','❺外部イベント参加数']];
/* 指定日の「翌月1日」を返す（YYYY-MM-DD） */
function nextMonthFirst(dateStr){
  const base=dateStr?new Date(dateStr+'T00:00:00'):new Date();
  const d=new Date(base.getFullYear(), base.getMonth()+1, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
}
function addMonthlyGoal(){
  const rows={};MG_ROWS.forEach(([k])=>rows[k]={pg:'',pr:'',g:'',tp:''});
  /* 直近の月の目標表から「今月の目標(g)」を新しい表の「先月の目標(pg)」へ、「今月の進捗(tp)」を「先月の結果(pr)」へ引き継ぐ */
  const prev=state.monthlyGoals.slice().sort((a,b)=>(a.reviewDate||'').localeCompare(b.reviewDate||'')||a.createdAt-b.createdAt).pop();
  if(prev&&prev.rows){MG_ROWS.forEach(([k])=>{const pr=prev.rows[k]||{};rows[k].pg=pr.g||'';rows[k].pr=pr.tp||'';});}
  /* 既に表があれば、その次の月として作成。初回は今月 */
  const reviewDate=prev?nextMonthFirst(prev.reviewDate||today()):today();
  state.monthlyGoals.push({id:uid(),reviewDate,rows,reason:'',createdAt:Date.now()});
  state.ui.goalMonth=monthKey(reviewDate); /* 追加した月に表示を切り替え */
  save();render();
}
function setMGReason(mgId,v){const m=state.monthlyGoals.find(x=>x.id===mgId); if(m){m.reason=v; save();}}
function mgMonthKey(m){return monthKey(m.reviewDate);}
function findMGForMonth(mk){return state.monthlyGoals.find(m=>mgMonthKey(m)===mk);}
function setMG(id,rk,col,v){const m=state.monthlyGoals.find(x=>x.id===id);if(m){m.rows[rk][col]=v;save();}}
function setMGdate(id,v){const m=state.monthlyGoals.find(x=>x.id===id);if(m){m.reviewDate=v;save();render();}}
function delMG(id){askConfirm('この月の目標表を削除しますか？',()=>{state.monthlyGoals=state.monthlyGoals.filter(x=>x.id!==id);save();render();});}
function lgSummaryLines(){
  return state.longGoals.slice()
    .sort((a,b)=>(b.due||'0000-00-00').localeCompare(a.due||'0000-00-00')||b.createdAt-a.createdAt) /* 先の日付が上、直近が下 */

function lgSummaryBox(){

  };
  const lgHtml=(state.longGoals.length?monthPickerHtmlYear(curYear,lgYears):'')+
    (yearGoals.length?yearGoals.map(lgCard).join('')
      :(state.longGoals.length?'<div class="empty">'+curYear+'年度の長期目標はありません。<br>上の📅で他の年度を選べます。</div>':'<div class="empty">「＋」で長期目標を追加できます。</div>'));
  /* 今月の目標と結果：現在の月を初期表示。過去・未来の月は選択式 */
  const mgMonths=state.monthlyGoals.map(m=>monthKey(m.reviewDate));
  const curMonth=state.ui.goalMonth||thisMonthKey();
  const monthMGs=state.monthlyGoals.filter(m=>monthKey(m.reviewDate)===curMonth).sort((a,b)=>b.createdAt-a.createdAt);
  const mgCard=m=>
    '<div class="card">'+
    '<div class="field"><label>目標見直し日</label><input type="date" value="'+esc(m.reviewDate)+'" onchange="setMGdate(\''+m.id+'\',this.value)"></div>'+
    '<div style="overflow-x:auto"><table class="goal"><tr><th style="min-width:120px"></th><th>先月の目標</th><th>先月の結果</th><th>今月の目標</th></tr>'+
    MG_ROWS.map(([rk,label])=>'<tr><td>'+esc(label)+'</td>'+['pg','pr','g'].map(c=>'<td><input type="text" inputmode="numeric" value="'+esc(m.rows[rk][c])+'" oninput="setMG(\''+m.id+'\',\''+rk+'\',\''+c+'\',this.value)"></td>').join('')+'</tr>').join('')+
    '</table></div>'+
    '<div style="margin-top:8px"><button class="btn danger small" onclick="delMG(\''+m.id+'\')">削除</button></div>'+
    '</div>';
  const mgHtml=(state.monthlyGoals.length?monthPickerHtml(curMonth,mgMonths,'setGoalMonth'):'')+
    (monthMGs.length?monthMGs.map(mgCard).join('')
      :(state.monthlyGoals.length?'<div class="empty">'+monthLabel(curMonth)+'の目標表はありません。<br>上の📅で他の月を選べます。</div>':'<div class="empty">「＋」で表を追加すると、月ごとにリストになります。</div>'));
  return '<h2 class="page">目標</h2>'+
    '<div class="section-label">長期目標</div>'+

    lgHtml+
    '<div class="section-label" style="margin-top:26px">今月の目標と結果</div>'+
    '<div class="btn-row"><button class="btn primary block" onclick="addMonthlyGoal()">＋ 今月の目標表を追加</button></div>'+
    mgHtml;
}
function monthPickerHtmlYear(curYear,years){return yearPickerHtml(curYear,years,'setGoalYear');}
/* ============================================================
   スケジュールシート
   ============================================================ */
function ensureSheet(date){
  if(!state.schedules[date]){
    const c=state.carry||{longGoal:'',monthGoal:'',startW:'',endW:'',metricGoals:{}};
    state.schedules[date]={
      longGoal:c.longGoal||'',monthGoal:c.monthGoal||'',todayGoal:'',sleep:'',wake:'',startW:c.startW||'',endW:c.endW||'',
      slots:{},slotsRed:{},slotABC:{},slotStrike:{},todo1:{},todo2:{},metrics:{},metricGoals:Object.assign({},c.metricGoals||{}),
      evCount:'',evCost:'',evLine:'',
      mood:0,ach10:0,apoList:'',score:'',scoreWhy:'',diary:''
    };
    save();
  }
  return state.schedules[date];
}
function setSheet(date,f,v){const s=ensureSheet(date);s[f]=v;if(f==='longGoal'||f==='monthGoal'||f==='startW'||f==='endW'){if(!state.carry)state.carry={longGoal:'',monthGoal:'',startW:'',endW:'',metricGoals:{}};state.carry[f]=v;}save();}
function setSheetTime(date,field,hh,mm){
  const s=ensureSheet(date);
  let parts=(s[field]||':').split(':'), ch=parts[0]||'', cm=parts[1]||'';
  if(hh!==null)ch=hh; if(mm!==null)cm=mm;
  const v=(ch===''&&cm==='')?'':((ch||'00')+':'+(cm||'00'));
  setSheet(date,field,v);
}
function setSheetSlot(date,t,v){const s=ensureSheet(date);s.slots[t]=v;save();}
function setSheetSlotRed(date,t,v){const s=ensureSheet(date);if(!s.slotsRed)s.slotsRed={};s.slotsRed[t]=v;save();}
function cospa(s){const c=parseFloat(s.evCost),l=parseFloat(s.evLine);if(!isFinite(c)||!isFinite(l)||l<=0)return '—';return Math.round(c/l).toLocaleString();}
function updCospa(date){const el=document.getElementById('evCospa');if(el)el.textContent=cospa(state.schedules[date]||{});}
function setSheetChk(date,group,i,v){const s=ensureSheet(date);s[group][i]=v;save();
  const el=document.getElementById('td_'+group+'_'+i); if(el)el.classList.toggle('done',v);}
function setSheetMetric(date,i,v){const s=ensureSheet(date);if(!s.metrics)s.metrics={};s.metrics[i]=v;save();}
function setSheetMetricGoal(date,i,v){const s=ensureSheet(date);if(!s.metricGoals)s.metricGoals={};s.metricGoals[i]=v;if(!state.carry)state.carry={};if(!state.carry.metricGoals)state.carry.metricGoals={};state.carry.metricGoals[i]=v;save();}
function setSheetABC(date,t,v){const s=ensureSheet(date);if(!s.slotABC)s.slotABC={};s.slotABC[t]=v;save();}
/* スケジュールのABCをワンタップで選択（同じものを再度押すと解除） */
function abcBtns(date,t,cur){
  return '<div class="abc-btns">'+['A','B','C'].map(x=>'<button type="button" class="abc-b'+(cur===x?' on':'')+'" onclick="abcPick(\''+date+'\',\''+esc(t)+'\',\''+x+'\',this)">'+x+'</button>').join('')+'</div>';
}
function abcPick(date,t,v,btn){
  const s=ensureSheet(date); const cur=(s.slotABC||{})[t]||'';
  const next=(cur===v)?'':v;
  setSheetABC(date,t,next);
  btn.parentNode.querySelectorAll('.abc-b').forEach(b=>b.classList.toggle('on',next!==''&&b.textContent===next));
}
function toggleSlotStrike(date,t){
  const s=ensureSheet(date);
  if(!s.slotStrike)s.slotStrike={};
  s.slotStrike[t]=!s.slotStrike[t];
  save();
  if(subView&&subView.type==='sheet'&&subView.date===date)render();
}
/* スマホでもダブルタップで取り消し線を引けるように、二回タップを自前で検出 */
let _slotTap={key:'',t:0};
function slotTapToggle(date,t,ev){
  const key=date+'|'+t, now=Date.now();
  if(_slotTap.key===key && now-_slotTap.t<350){
    _slotTap={key:'',t:0};
    if(ev&&ev.cancelable)ev.preventDefault();
    toggleSlotStrike(date,t);
  }else{
    _slotTap={key:key,t:now};
  }
}
function setSheetCustom(date,i,v){const s=ensureSheet(date);const label=(state.scheduleTemplate.customFields||[])[i];if(label==null)return;if(!s.custom)s.custom={};s.custom[label]=v;save();}
function setSheetScale(date,f,v){const s=ensureSheet(date);s[f]=v;save();render();}
function deleteSheet(date){askConfirm(fmtDate(date)+' のシートを削除しますか？',()=>{delete state.schedules[date];save();subView=null;render();});}
function openSheet(date){ensureSheet(date);subView={type:'sheet',date};currentTab='schedule';syncTabbar();render();window.scrollTo(0,0);}

function timeSel(date,field,value){
  const p=(value||'').split(':'), hh=p[0]||'', mm=p[1]||'';
  let hOpts='<option value=""></option>';
  for(let i=0;i<24;i++){const v=String(i).padStart(2,'0');hOpts+='<option value="'+v+'"'+(hh===v?' selected':'')+'>'+v+'</option>';}
  const mOpts='<option value=""></option>'+['00','15','30','45'].map(v=>'<option value="'+v+'"'+(mm===v?' selected':'')+'>'+v+'</option>').join('');
  return '<div class="time-sel"><select onchange="setSheetTime(\''+date+'\',\''+field+'\',this.value,null)">'+hOpts+'</select><span>:</span><select onchange="setSheetTime(\''+date+'\',\''+field+'\',null,this.value)">'+mOpts+'</select></div>';
}
function scaleBtns(date,field,max,val){
  let h='<div class="scale-row">';
  for(let i=1;i<=max;i++)h+='<button class="'+(Number(val)===i?'on':'')+'" onclick="setSheetScale(\''+date+'\',\''+field+'\','+i+')">'+i+'</button>';
  return h+'</div>';
}

function fitA4(){
  const w=document.getElementById('a4wrap'), p=document.getElementById('a4paper');
  if(!w||!p)return;
  const natH=p.offsetHeight||1123;
  const availW=(w.parentElement||document.body).clientWidth;
  if(isPhone()){
    /* スマホ：横幅いっぱい（縦はスクロール） */
    w.style.width=''; w.style.margin='';
    const sc=Math.min(1, availW/794);
    p.style.transform='scale('+sc+')';
    w.style.height=(natH*sc+8)+'px';
  }else{
    /* PC：横も縦も画面に収める（スクロール不要）＆中央寄せ */
    const availH=Math.max(240, window.innerHeight-72);
    const sc=Math.min(availW/794, availH/natH, 1);
    p.style.transform='scale('+sc+')';
    w.style.width=(794*sc)+'px';
    w.style.margin='0 auto';
    w.style.height=(natH*sc)+'px';
  }
}

    .map(a=>({grp:a.abcd,star:a.star||'',name:a.name||'',age:a.age!==''?String(grownNumber(a.age,a.ageYear)):'',job:joinVal(a.jobSel,a.job),dev:joinVal(a.devSel,a.dev),memo:''}));

function addMtg(){
  const list=state.mtgs.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const prev=list[list.length-1];
  const curAbd=abdSnapshot();
  const curNames=new Set(curAbd.map(p=>p.name).filter(Boolean));
  /* 前回のToDo：今もアポ管理でABDの同一人物のみ、前回の自由記入欄の内容を引き継ぐ */
  const prevTodo=prev?JSON.parse(JSON.stringify((prev.abdList||[]).filter(p=>p.name&&curNames.has(p.name)))):[];
  /* 前回のToDoの★も現在のアポ管理の状態（★稼働中/☆参画予定/なし）を反映 */
  const starMap={}; curAbd.forEach(p=>{if(p.name)starMap[p.name]=p.star||'';});
  prevTodo.forEach(p=>{if(p.name)p.star=starMap[p.name]||'';});
  /* 前回のToDoの自由記入欄の内容を、ABDの人を箇条書きへの自由記入欄にも反映（同一人物ごと） */
  const todoMemo=memoMapFromList(prevTodo);
  curAbd.forEach(p=>{if(p.name&&todoMemo[p.name])p.memo=todoMemo[p.name];});
  const m={
    id:uid(), createdAt:Date.now(),
    date:today(), nextDate:'',
    prevTodo: prevTodo,
    abdList: curAbd,
    longGoalText: lgSummaryLines().join(String.fromCharCode(10)),
    mgMonthKey: monthKey(today()),
    nextTodo:''
  };
  state.mtgs.push(m); save();
  subView={type:'mtgForm',id:m.id}; currentTab='mtg'; syncTabbar(); render(); window.scrollTo(0,0);
}
function setMtg(id,field,value){const m=state.mtgs.find(x=>x.id===id); if(m){m[field]=value; save();}}
function deleteMtg(id){askConfirm('このMTG記録を削除しますか？',()=>{state.mtgs=state.mtgs.filter(x=>x.id!==id);save();subView=null;render();});}
function memoMapFromList(list){const mp={};(list||[]).forEach(p=>{if(p.name&&p.memo)mp[p.name]=p.memo;});return mp;}
function refreshAbdFromManage(id){
  const m=state.mtgs.find(x=>x.id===id); if(!m)return;
  const keepMemo=memoMapFromList(m.abdList); /* すでに書いた自由記入欄は残す */
  const todoMemo=memoMapFromList(m.prevTodo); /* 無ければ前回のToDoの内容を反映 */
  m.abdList=abdSnapshot().map(p=>{p.memo=p.name?(keepMemo[p.name]||todoMemo[p.name]||''):''; return p;});
  save(); render(); toast('アポ管理のA・B・Dの人で更新しました');
}
function mtgListView(){
  const list=state.mtgs.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.createdAt-b.createdAt);
  const groups={};
  list.forEach(m=>{const k=monthKey(m.date);(groups[k]=groups[k]||[]).push(m);});
  const keys=Object.keys(groups).sort();
  const body=keys.map(k=>
    '<div class="month-head"><span class="tab">'+monthLabel(k)+'</span><span class="cnt">'+groups[k].length+'件</span></div>'+
    '<div class="month-body">'+groups[k].map(m=>
      '<div class="card tap" onclick="subView={type:\'mtgForm\',id:\''+m.id+'\'};render();window.scrollTo(0,0)">'+
      '<button class="card-del" onclick="event.stopPropagation();deleteMtg(\''+m.id+'\')" aria-label="削除">🗑</button>'+
      '<div class="rec-title" style="font-size:15px">'+(m.date?fmtDate(m.date):'日付未定')+'</div>'+
      '<div class="rec-sub">次回の日程：'+(m.nextDate?fmtDate(m.nextDate):'未定')+'　ABD：'+((m.abdList||[]).length)+'名</div>'+
      '</div>').join('')+'</div>'
  ).join('');
  return '<h2 class="page">個別MTG <small>全'+list.length+'件</small></h2>'+
    '<div class="btn-row"><button class="btn primary block" onclick="addMtg()">＋ 新しいMTG記録を追加</button></div>'+
    (list.length?body:'<div class="empty">まだMTG記録がありません。<br>「＋」で作成すると、日付の月ごとにリストになります。</div>');
}

/* ---------- 保存データの形式そろえ（過去バージョンからの移行含む） ---------- */
function applySavedToState(saved){
  if(!saved)return;
  state=Object.assign(defaultState(),saved);
  state.options=Object.assign(defaultState().options,saved.options||{});
  state.scheduleTemplate=Object.assign(defaultState().scheduleTemplate,saved.scheduleTemplate||{});
  state.ui=saved.ui||{};
  (state.monthlyGoals||[]).forEach(m=>{Object.keys(m.rows||{}).forEach(rk=>{if(m.rows[rk].tp===undefined)m.rows[rk].tp='';});if(m.reason===undefined)m.reason='';});
  if(!state.weeklyReviews)state.weeklyReviews=[];
  if(!state.mtgs)state.mtgs=[];
  (state.mtgs||[]).forEach(m=>{
    if(m.longGoalText===undefined){m.longGoalText=(lgSummaryLines().join('\n'))+(m.longGoalNote?('\n'+m.longGoalNote):'');}
    (m.abdList||[]).forEach(p=>{if(!p.grp)p.grp='A';});
  });
  if(!state.carry){
    state.carry={longGoal:'',monthGoal:''};
    const ds=Object.keys(state.schedules).sort();
    if(ds.length){const last=state.schedules[ds[ds.length-1]];state.carry.longGoal=last.longGoal||'';state.carry.monthGoal=last.monthGoal||'';}
  }
  {
    const ds=Object.keys(state.schedules).sort();
    const last=ds.length?state.schedules[ds[ds.length-1]]:null;
    if(state.carry.startW===undefined)state.carry.startW=last?(last.startW||''):'';
    if(state.carry.endW===undefined)state.carry.endW=last?(last.endW||''):'';
    if(!state.carry.metricGoals)state.carry.metricGoals=last?Object.assign({},last.metricGoals||{}):{};
  }
}

/* ---------- ログイン画面の表示切り替え ---------- */
function showAuthScreen(msg){
  document.getElementById('appRoot').style.display='none';
  document.getElementById('authScreen').style.display='flex';
  const s=document.getElementById('authStatus'); if(s)s.textContent=msg||'';
  const e=document.getElementById('authError'); if(e)e.style.display='none';
}
function showApp(){
  document.getElementById('authScreen').style.display='none';
  document.getElementById('appRoot').style.display='';
}
async function doLogin(){
  if(sdkLoadFailed||!sb){
    const errEl=document.getElementById('authError');
    errEl.textContent='アプリの部品を読み込めませんでした。電波の良い場所で、ページを一度再読み込みしてもう一度お試しください。';
    errEl.style.display='block';
    return;
  }
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const errEl=document.getElementById('authError');
  const statusEl=document.getElementById('authStatus');
  errEl.style.display='none';
  if(!email||!password){errEl.textContent='メールアドレスとパスワードを入力してください';errEl.style.display='block';return;}
  statusEl.textContent='ログイン中…';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){
      statusEl.textContent='';
      errEl.textContent=navigator.onLine?'ログインできませんでした。メールアドレスとパスワードをご確認ください。':'電波が届いていないためログインできません。電波の良い場所でもう一度お試しください。';
      errEl.style.display='block';
      return;
    }
    currentUser=data.user;
    await afterLogin();
  }catch(e){
    statusEl.textContent='';
    errEl.textContent='通信エラーが発生しました。電波の良い場所でもう一度お試しください。';
    errEl.style.display='block';
  }
}
async function doSignup(){
  if(sdkLoadFailed||!sb){
    const errEl=document.getElementById('authError');
    errEl.textContent='アプリの部品を読み込めませんでした。電波の良い場所で、ページを一度再読み込みしてもう一度お試しください。';
    errEl.style.display='block';
    return;
  }
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const errEl=document.getElementById('authError');
  const statusEl=document.getElementById('authStatus');
  errEl.style.display='none';
  if(!email||!password){errEl.textContent='メールアドレスとパスワードを入力してください';errEl.style.display='block';return;}
  if(password.length<6){errEl.textContent='パスワードは6文字以上で作成してください';errEl.style.display='block';return;}
  statusEl.textContent='アカウントを作成中…';
  try{
    const {data,error}=await sb.auth.signUp({email,password});
    if(error){
      statusEl.textContent='';
      const m=(error.message||'');
      errEl.textContent=/already|registered|exists/i.test(m)?'このメールアドレスはすでに登録されています。ログインをお試しください。':('アカウントを作成できませんでした：'+m);
      errEl.style.display='block';
      return;
    }
    if(data&&data.session&&data.user){
      /* メール確認オフ → そのままログイン */
      currentUser=data.user; await afterLogin();
    }else{
      /* メール確認オン → 確認メール送信済み */
      statusEl.textContent='確認メールを送信しました。メール内のリンクを開いて認証してから、上の「ログイン」でお進みください。';
    }
  }catch(e){
    statusEl.textContent='';
    errEl.textContent='通信エラーが発生しました。電波の良い場所でもう一度お試しください。';
    errEl.style.display='block';
  }
}
async function doLogout(){
  closeModal();
  try{await sb.auth.signOut();}catch(e){}
  currentUser=null;
  showAuthScreen();
}
async function afterLogin(){
  const cached=localCache.get();
  applySavedToState(cached);
  showApp();
  render();
  tryNotify();
  if(navigator.onLine){
    setSyncStatus('wait','同期中…');
    const hadCloud=await pullAppData();
    await pullApposAndReferrals();
    applySavedToState(state);
    localCache.set(state);
    render();
    if(!hadCloud){ await pushAllLocalToCloud(); } /* クラウドが空なら手元のデータで初期化（初回同期） */
    await flushQueue();
    setSyncStatus('ok','同期済み');
  }else{
    setSyncStatus('off','オフライン（前回の内容を表示中）');
  }
}

/* ============================================================
   閲覧専用の共有リンク（発行・共有ビュー）
   ============================================================ */
function randToken(){
  const a=new Uint8Array(18); (crypto&&crypto.getRandomValues)?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.floor(Math.random()*256));
  return Array.from(a).map(b=>('0'+b.toString(16)).slice(-2)).join('');
}
function shareUrlOf(token){return location.origin+location.pathname+'?share='+token;}
async function createShareLink(){
  if(!currentUser){toast('ログインが必要です');return;}
  if(!navigator.onLine){toast('電波の良い場所でお試しください');return;}
  let token=(state.ui&&state.ui.shareToken)||'';
  if(!token)token=randToken();
  try{
    const {error}=await sb.from('shares').upsert({token,user_id:currentUser.id},{onConflict:'token'});
    if(error){console.error('share upsert error',error);toast('リンク作成に失敗：'+(error.message||error.code||error.hint||'原因不明'));return;}
  }catch(e){console.error('share upsert exception',e);toast('リンク作成に失敗：'+(e&&e.message?e.message:e));return;}
  if(!state.ui)state.ui={};
  state.ui.shareToken=token; save();
  openSettings(); /* 設定画面を開き直してリンクを表示 */
  toast('閲覧専用リンクを作成しました');
}
async function revokeShareLink(){
  const token=(state.ui&&state.ui.shareToken)||'';
  if(!token){openSettings();return;}
  askConfirm('共有リンクを無効にしますか？（今のリンクは開けなくなります）',async()=>{
    try{ if(currentUser)await sb.from('shares').delete().eq('token',token).eq('user_id',currentUser.id); }catch(e){}
    if(state.ui)state.ui.shareToken=''; save();
    closeModal(); openSettings(); toast('共有リンクを無効にしました');
  });
}
function copyShareLink(){
  const token=(state.ui&&state.ui.shareToken)||''; if(!token)return;
  const t=shareUrlOf(token);
  const done=()=>toast('リンクをコピーしました');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>{fallbackCopy(t);done();});}
  else{fallbackCopy(t);done();}
}
async function enterShareView(token){
  shareMode=true;
  document.body.classList.add('share-view');
  showApp();
  const v=document.getElementById('view');
  if(v)v.innerHTML='<div class="empty">共有された内容を読み込んでいます…</div>';
  try{
    const {data,error}=await sb.rpc('get_shared_data',{p_token:token});
    if(error||!data||!data.app){
      document.body.classList.remove('share-view'); shareMode=false;
      showAuthScreen('共有リンクが無効か、期限切れです。作成者にご確認ください。');
      return;
    }
    state=Object.assign(defaultState(),data.app);
    state.apos=(data.apos||[]).map(r=>Object.assign({id:r.id},r.data||{}));
    state.referrals=(data.referrals||[]).map(r=>Object.assign({id:r.id},r.data||{}));
    applySavedToState(state);
    /* 上書き：applySavedToStateがapos/referralsを消さないよう再セット */
    state.apos=(data.apos||[]).map(r=>Object.assign({id:r.id},r.data||{}));
    state.referrals=(data.referrals||[]).map(r=>Object.assign({id:r.id},r.data||{}));
    currentTab='schedule'; subView=null;
    applyFontSize(); applyTheme();
    setSyncStatus('ok','閲覧専用');
    render(); syncTabbar();
  }catch(e){
    document.body.classList.remove('share-view'); shareMode=false;
    showAuthScreen('共有内容を読み込めませんでした。電波の良い場所で再読み込みしてください。');
  }
}
function lockReadOnly(){
  const root=document.getElementById('view'); if(!root)return;
  root.querySelectorAll('input,textarea').forEach(el=>{el.readOnly=true;});
  root.querySelectorAll('select').forEach(el=>{ if(!el.closest('.month-nav'))el.disabled=true; }); /* 月・年の切替だけは操作可 */
  root.querySelectorAll('button').forEach(b=>{
    const oc=b.getAttribute('onclick')||'';
    const isDel=b.classList.contains('card-del')||b.classList.contains('abd-del')||b.classList.contains('mic');
    const editish=/(^|[^a-zA-Z])(add|del|delete|remove|reset|export|duplicate|createRef|refresh|askNotify|setTheme|setFont|saveTpl|resetAll|customize)/i.test(oc);
    const nav=/(subView|render\(|showPicker|Month\(|Year\(|preview|printA4|closeModal|scrollTo)/.test(oc);
    if(isDel||(editish&&!nav))b.style.display='none';
  });
}

/* ---------- 起動 ---------- */
(async function init(){
  applyFontSize();
  applyTheme();
  const pwEl=document.getElementById('authPassword'), emEl=document.getElementById('authEmail');
  if(pwEl)pwEl.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  if(emEl)emEl.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  if(sdkLoadFailed||!sb){
    showAuthScreen('アプリの部品を読み込めませんでした。電波の良い場所でページを再読み込みしてください。');
    return;
  }
  const shareToken=new URLSearchParams(location.search).get('share');
  if(shareToken){ await enterShareView(shareToken); return; }
  try{
    const {data}=await sb.auth.getSession();
    if(data&&data.session&&data.session.user){
      currentUser=data.session.user;
      await afterLogin();
    }else{
      showAuthScreen();
    }
  }catch(e){
    showAuthScreen();
  }
  sb.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'){ currentUser=null; showAuthScreen(); }
  });
})();
