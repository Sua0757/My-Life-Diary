name: Deploy to Cloudflare Pages

# public/ フォルダの中身（index.html）を Cloudflare Pages に自動デプロイします。
# 事前に GitHub リポジトリの Settings > Secrets に以下2つを登録してください:
#   - CLOUDFLARE_API_TOKEN   … Cloudflare で発行する API トークン
#   - CLOUDFLARE_ACCOUNT_ID  … Cloudflare のアカウント ID
# 詳しい取得手順は README.md を参照してください。

on:
  push:
    branches:
      - main
      - claude/my-life-diary-cloudflare-404-tkpg9q
  workflow_dispatch: # 手動実行も可能

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Cloudflare Pages へデプロイ
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # public フォルダを "my-life-diary" という名前の Pages プロジェクトとして公開。
          # プロジェクトが存在しない場合は自動で作成されます。
          # --branch=main を付けることで本番URL( https://my-life-diary.pages.dev )として公開されます。
          command: pages deploy public --project-name=my-life-diary --branch=main
